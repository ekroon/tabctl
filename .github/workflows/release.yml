name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.6.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          if [ -z "$tag" ]; then
            echo "Release tag is required." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve-tag
    runs-on: macos-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag and mirrored versions
        id: check
        shell: bash
        run: |
          tag='${{ needs.resolve-tag.outputs.tag }}'
          version="$(node -e "process.stdout.write(require('./scripts/version-utils').readWorkspaceVersion(process.cwd()))")"
          if [ "$tag" != "v${version}" ]; then
            echo "Release tag ($tag) must match workspace version (v${version})." >&2
            exit 1
          fi
          node - <<'NODE'
          const path = require("path");
          const { readCargoPackageVersion, readJson, readWorkspaceVersion } = require("./scripts/version-utils");
          const root = process.cwd();
          const version = readWorkspaceVersion(root);
          const mismatches = [];
          for (const file of ["package.json", "package-lock.json"]) {
            if (readJson(path.join(root, file)).version !== version) mismatches.push(file);
          }
          for (const crate of ["shared", "host", "graphql", "tabctl"]) {
            const file = `rust/crates/${crate}/Cargo.toml`;
            if (readCargoPackageVersion(path.join(root, file), version) !== version) mismatches.push(file);
          }
          if (mismatches.length) {
            console.error(`Version drift from ${version}: ${mismatches.join(", ")}`);
            process.exit(1);
          }
          NODE
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-alpha.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-* ]]; then
            echo "Only -alpha.N and -rc.N prerelease versions are supported." >&2
            exit 1
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [resolve-tag, validate]
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml --locked --release --target ${{ matrix.target }} -p tabctl
      - name: Package binary
        run: |
          cd rust/target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/tabctl-${{ needs.resolve-tag.outputs.tag }}-${{ matrix.asset_suffix }}.tar.gz" tabctl
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: tabctl-${{ matrix.asset_suffix }}
          path: tabctl-${{ needs.resolve-tag.outputs.tag }}-${{ matrix.asset_suffix }}.tar.gz

  extension:
    needs: [resolve-tag, validate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: npm ci
      - run: npm test
        env:
          TABCTL_VERSION_MODE: release
      - name: Package extension
        run: |
          mkdir -p artifacts
          (cd dist && zip -qr ../artifacts/tabctl-extension.zip extension)
          shasum -a 256 artifacts/tabctl-extension.zip > artifacts/tabctl-extension.zip.sha256
      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabctl-extension
          path: |
            artifacts/tabctl-extension.zip
            artifacts/tabctl-extension.zip.sha256

  npm_publish:
    needs: [resolve-tag, validate, build, extension]
    if: ${{ vars.PUBLISH_NPM != 'false' }}
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:packaging
      - uses: actions/download-artifact@v4
        with:
          pattern: tabctl-*
          path: release-artifacts
          merge-multiple: true
      - name: Construct universal native npm distribution
        env:
          TAG_NAME: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          mkdir -p build/npm-arm64 build/npm-x86 dist
          tar -xzf "release-artifacts/tabctl-${TAG_NAME}-darwin-arm64.tar.gz" -C build/npm-arm64
          tar -xzf "release-artifacts/tabctl-${TAG_NAME}-darwin-x86_64.tar.gz" -C build/npm-x86
          expected="$(cut -d ' ' -f 1 release-artifacts/tabctl-extension.zip.sha256)"
          actual="$(shasum -a 256 release-artifacts/tabctl-extension.zip | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          unzip -q release-artifacts/tabctl-extension.zip -d dist
          npm run package:npm -- build/npm-arm64/tabctl build/npm-x86/tabctl
      - name: Pack and verify native npm installation and isolated setup
        run: npm run verify:npm
      - name: Publish tabctl
        run: npm publish "build/npm-package/tabctl-${{ needs.validate.outputs.version }}.tgz" --ignore-scripts --provenance --access public --tag '${{ needs.validate.outputs.dist_tag }}'

  create-release:
    needs: [resolve-tag, validate, build, extension, npm_publish]
    if: ${{ always() && needs.validate.result == 'success' && needs.build.result == 'success' && needs.extension.result == 'success' && (needs.npm_publish.result == 'success' || needs.npm_publish.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-tag.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" artifacts/* --clobber
            exit 0
          fi
          prerelease_flag=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            "${prerelease_flag[@]}" \
            artifacts/*
