name: WSL Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wsl-support-ci
    paths:
      - ".github/workflows/wsl-experiment.yml"
      - ".github/workflows/test.yml"
      - "scripts/ci/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wsl-experiment.yml"
      - ".github/workflows/test.yml"
      - "scripts/ci/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  wsl:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate WSL setup and integration
        shell: pwsh
        run: ./scripts/ci/run-wsl-validation.ps1 -Workspace "${{ github.workspace }}"

      - name: Upload WSL experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-experiment-artifacts
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/wsl-diagnostics.txt
            ${{ github.workspace }}/wsl-setup.json
            ${{ github.workspace }}/wsl-integration.log
            ${{ github.workspace }}/wsl-execution-marker.txt
