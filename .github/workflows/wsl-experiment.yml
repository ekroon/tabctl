name: WSL Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wsl-support-ci
    paths:
      - ".github/workflows/wsl-experiment.yml"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wsl-experiment.yml"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  wsl:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect or install WSL distro
        shell: pwsh
        run: |
          wsl --status
          $distros = wsl --list --quiet |
            ForEach-Object { ($_ -replace "`0", "").Trim() } |
            Where-Object { $_ -and $_ -notlike "docker-desktop*" }
          $distro = $distros | Where-Object { $_ -like "Ubuntu*" } | Select-Object -First 1
          if (-not $distro) {
            $distro = $distros | Select-Object -First 1
          }
          if (-not $distro) {
            Write-Host "No WSL distro found; installing Ubuntu..."
            wsl --install -d Ubuntu --no-launch
            $distros = wsl --list --quiet |
              ForEach-Object { ($_ -replace "`0", "").Trim() } |
              Where-Object { $_ -and $_ -notlike "docker-desktop*" }
            $distro = $distros | Where-Object { $_ -like "Ubuntu*" } | Select-Object -First 1
            if (-not $distro) {
              $distro = $distros | Select-Object -First 1
            }
          }
          if (-not $distro) {
            throw "No WSL distro available after installation attempt."
          }
          wsl -d $distro -- uname -a
          "WSL_DISTRO=$distro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using WSL distro: $distro"

      - name: Install WSL prerequisites
        shell: pwsh
        run: |
          $script = @'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg golang-go
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-linux.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          node --version
          npm --version
          go version
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)
          '@
          wsl -d $env:WSL_DISTRO -- bash -lc ($script -replace "`r", "")

      - name: Resolve WSL workspace path
        shell: pwsh
        run: |
          $winWorkspace = "${{ github.workspace }}"
          $workspace = (wsl -d $env:WSL_DISTRO -- env WIN_WORKSPACE="$winWorkspace" bash -lc 'wslpath -a -u "$WIN_WORKSPACE"').Trim()
          if (-not $workspace) {
            throw "Could not resolve WSL workspace path."
          }
          "WSL_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WSL workspace path: $workspace"

      - name: Capture WSL diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          $script = @'
          set -euxo pipefail
          diag_file="/tmp/tabctl-wsl-diagnostics.txt"
          {
            echo "distro: ${WSL_DISTRO}"
            echo "uname: $(uname -a)"
            echo "os-release:"
            cat /etc/os-release
            echo "node: $(node --version 2>/dev/null || echo missing)"
            echo "npm: $(npm --version 2>/dev/null || echo missing)"
            echo "go: $(go version 2>/dev/null || echo missing)"
            echo "chrome: $(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || echo missing)"
          } > "$diag_file"
          '@
          $tmpScript = "${{ github.workspace }}/wsl-diagnostics.sh"
          [System.IO.File]::WriteAllText($tmpScript, ($script -replace "`r", ""), [System.Text.UTF8Encoding]::new($false))
          wsl -d $env:WSL_DISTRO -- env WSL_WORKSPACE="$env:WSL_WORKSPACE" WSL_DISTRO="$env:WSL_DISTRO" bash "$env:WSL_WORKSPACE/wsl-diagnostics.sh"
          $status = $LASTEXITCODE
          $diagOutput = wsl -d $env:WSL_DISTRO -- bash -lc 'cat /tmp/tabctl-wsl-diagnostics.txt 2>/dev/null'
          if ($LASTEXITCODE -eq 0 -and $diagOutput) {
            $diagOutput | Out-File -FilePath "${{ github.workspace }}/wsl-diagnostics.txt" -Encoding utf8
          }
          Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
          if ($status -ne 0) {
            exit $status
          }

      - name: Build and unit test in WSL
        shell: pwsh
        run: |
          $script = @'
          set -euxo pipefail
          cd "$WSL_WORKSPACE"
          if [ -f src/tests/unit/fixtures/npx ]; then
            sed -i 's/\r$//' src/tests/unit/fixtures/npx
          fi
          npm ci
          npm run build
          npm run test:unit
          '@
          $tmpScript = "${{ github.workspace }}/wsl-build-unit.sh"
          [System.IO.File]::WriteAllText($tmpScript, ($script -replace "`r", ""), [System.Text.UTF8Encoding]::new($false))
          wsl -d $env:WSL_DISTRO -- env WSL_WORKSPACE="$env:WSL_WORKSPACE" bash "$env:WSL_WORKSPACE/wsl-build-unit.sh"
          $status = $LASTEXITCODE
          Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
          if ($status -ne 0) {
            exit $status
          }

      - name: Setup from WSL for Windows browser
        shell: pwsh
        run: |
          $script = @'
          set -euo pipefail
          cd "$WSL_WORKSPACE"
          extension_id="$(node <<'NODE'
          const crypto = require("node:crypto");
          const path = require("node:path");
          const extensionDir = path.resolve("dist/extension");
          const hash = crypto.createHash("sha256").update(extensionDir).digest("hex").slice(0, 32);
          let id = "";
          for (const c of hash) {
            id += String.fromCharCode("a".charCodeAt(0) + parseInt(c, 16));
          }
          console.log(id);
          NODE
          )"
          node dist/cli/tabctl.js setup --browser chrome --extension-id "$extension_id" --json > /tmp/tabctl-wsl-setup.json
          node <<'NODE'
          const fs = require("node:fs");
          const output = JSON.parse(fs.readFileSync("/tmp/tabctl-wsl-setup.json", "utf8"));
          if (!output.ok) throw new Error("setup command failed");
          const data = output.data || {};
          if (data.runtimeEnv !== "wsl") throw new Error(`expected runtimeEnv=wsl, got ${data.runtimeEnv}`);
          if (typeof data.wrapperPath !== "string" || !/^[A-Za-z]:\\/.test(data.wrapperPath)) {
            throw new Error(`expected Windows wrapperPath, got ${data.wrapperPath}`);
          }
          if (typeof data.windowsManifestPath !== "string" || !/^[A-Za-z]:\\/.test(data.windowsManifestPath)) {
            throw new Error(`expected windowsManifestPath, got ${data.windowsManifestPath}`);
          }
          if (typeof data.unixWrapperPath !== "string" || !data.unixWrapperPath.startsWith("/")) {
            throw new Error(`expected unixWrapperPath, got ${data.unixWrapperPath}`);
          }
          console.log("WSL setup output validated");
          NODE
          cp /tmp/tabctl-wsl-setup.json "$WSL_WORKSPACE/wsl-setup.json" || true
          '@
          $tmpScript = "${{ github.workspace }}/wsl-setup-check.sh"
          [System.IO.File]::WriteAllText($tmpScript, ($script -replace "`r", ""), [System.Text.UTF8Encoding]::new($false))
          wsl -d $env:WSL_DISTRO -- env WSL_WORKSPACE="$env:WSL_WORKSPACE" bash "$env:WSL_WORKSPACE/wsl-setup-check.sh"
          $status = $LASTEXITCODE
          $setupOutput = wsl -d $env:WSL_DISTRO -- bash -lc 'cat /tmp/tabctl-wsl-setup.json 2>/dev/null'
          if ($LASTEXITCODE -eq 0 -and $setupOutput) {
            $setupOutput | Out-File -FilePath "${{ github.workspace }}/wsl-setup.json" -Encoding utf8
          }
          Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
          if ($status -ne 0) {
            exit $status
          }

      - name: Integration test from WSL against Windows browser
        shell: pwsh
        run: |
          $script = @'
          set -euo pipefail
          cd "$WSL_WORKSPACE"
          log_file="/tmp/tabctl-wsl-integration.log"
          win_workspace="$(wslpath -w "$WSL_WORKSPACE")"
          win_chrome=""
          if [ -f /mnt/c/Program\ Files/Google/Chrome/Application/chrome.exe ]; then
            win_chrome="$(wslpath -w /mnt/c/Program\ Files/Google/Chrome/Application/chrome.exe)"
          elif [ -f /mnt/c/Program\ Files/Microsoft/Edge/Application/msedge.exe ]; then
            win_chrome="$(wslpath -w /mnt/c/Program\ Files/Microsoft/Edge/Application/msedge.exe)"
          elif [ -f /mnt/c/Program\ Files\ \(x86\)/Microsoft/Edge/Application/msedge.exe ]; then
            win_chrome="$(wslpath -w /mnt/c/Program\ Files\ \(x86\)/Microsoft/Edge/Application/msedge.exe)"
          fi
          if [ -z "$win_chrome" ]; then
            echo "No Windows Chrome/Edge binary found; skipping integration test." > "$log_file"
            cp "$log_file" "$WSL_WORKSPACE/wsl-integration.log" || true
            exit 0
          fi
          echo "Using Windows browser: $win_chrome" > "$log_file"
          set +e
          powershell.exe -NoProfile -Command "\$ErrorActionPreference='Stop'; Set-Location '$win_workspace'; \$env:CHROME_PATH='$win_chrome'; node dist/scripts/integration-test.js" 2>&1 | tee -a "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          cp "$log_file" "$WSL_WORKSPACE/wsl-integration.log" || true
          exit "$status"
          '@
          $tmpScript = "${{ github.workspace }}/wsl-integration.sh"
          [System.IO.File]::WriteAllText($tmpScript, ($script -replace "`r", ""), [System.Text.UTF8Encoding]::new($false))
          wsl -d $env:WSL_DISTRO -- env WSL_WORKSPACE="$env:WSL_WORKSPACE" bash "$env:WSL_WORKSPACE/wsl-integration.sh"
          $status = $LASTEXITCODE
          $integrationOutput = wsl -d $env:WSL_DISTRO -- bash -lc 'cat /tmp/tabctl-wsl-integration.log 2>/dev/null'
          if ($LASTEXITCODE -eq 0 -and $integrationOutput) {
            $integrationOutput | Out-File -FilePath "${{ github.workspace }}/wsl-integration.log" -Encoding utf8
          }
          Remove-Item -Path $tmpScript -ErrorAction SilentlyContinue
          if ($status -ne 0) {
            exit $status
          }

      - name: Ensure artifact files exist
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ github.workspace }}/wsl-diagnostics.txt")) {
            "WSL diagnostics were not generated." | Out-File -FilePath "${{ github.workspace }}/wsl-diagnostics.txt" -Encoding utf8
          }
          if (-not (Test-Path "${{ github.workspace }}/wsl-setup.json")) {
            "{`"ok`":false,`"error`":`"WSL setup output was not generated.`"}" | Out-File -FilePath "${{ github.workspace }}/wsl-setup.json" -Encoding utf8
          }
          if (-not (Test-Path "${{ github.workspace }}/wsl-integration.log")) {
            "WSL integration log was not generated." | Out-File -FilePath "${{ github.workspace }}/wsl-integration.log" -Encoding utf8
          }

      - name: Upload WSL experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-experiment-artifacts
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/wsl-diagnostics.txt
            ${{ github.workspace }}/wsl-setup.json
            ${{ github.workspace }}/wsl-integration.log
