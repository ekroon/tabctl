name: Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test

  integration:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets

  wsl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate WSL setup and integration
        shell: pwsh
        run: ./scripts/ci/run-wsl-validation.ps1 -Workspace "${{ github.workspace }}"
      - name: Upload WSL CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl-ci-artifacts
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/wsl-diagnostics.txt
            ${{ github.workspace }}/wsl-setup.json
            ${{ github.workspace }}/wsl-integration.log
            ${{ github.workspace }}/wsl-execution-marker.txt
            ${{ github.workspace }}/wsl-timings.txt
