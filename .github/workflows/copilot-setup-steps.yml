name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Ensure Go is available
        run: |
          if ! command -v go &>/dev/null; then
            echo "Go not found, installing via setup-go"
            echo "GO_MISSING=true" >> "$GITHUB_ENV"
          else
            echo "Go $(go version | awk '{print $3}') already available"
          fi

      - name: Install Go (fallback)
        if: env.GO_MISSING == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
