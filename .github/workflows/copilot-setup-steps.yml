name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            npm ci
          else
            echo "Source-only review: skip macOS dependency installation."
          fi

      - name: Build
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            npm run build
          else
            echo "Source-only review: skip macOS build."
          fi

      - name: Explain source-only setup on managed non-macOS runners
        if: runner.os != 'macOS'
        run: echo "tabctl builds and tests require macOS. Review source here; use the required macOS CI checks for validation."
