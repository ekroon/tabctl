[package]
name = "tabctl-host"
version.workspace = true
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
html-to-markdown-rs = "3.5.7"
rusqlite = { version = "0.33", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tabctl-shared = { path = "../shared" }

[dev-dependencies]
tabctl-graphql = { path = "../graphql" }
